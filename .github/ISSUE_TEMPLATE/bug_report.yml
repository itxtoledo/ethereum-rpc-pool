name: Bug Report
description: Report a bug or unexpected behavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version are you running? (`app --version` or Docker image tag)
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Start the server with `RPC_LIST=...`
        2. Send `curl -X POST ...`
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any log output. Use JSON formatting if possible.
      render: json
  - type: input
    id: rpc-provider
    attributes:
      label: RPC provider(s)
      description: Which upstream RPC(s) were you using? (Infura, Alchemy, self-hosted, etc.)
      placeholder: Infura, Alchemy
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help — deployment method, OS, Go version, etc.
